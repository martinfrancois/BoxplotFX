name: Feature request
description: Track a feature approved in Discussions (propose new ideas in Discussions first).
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: New ideas start in the [Ideas discussions](https://github.com/martinfrancois/BoxplotFX/discussions/categories/ideas). Once I approve a feature there, I open an issue for it with this form, and you can claim the issue with `/take`.
  - type: input
    id: discussion
    attributes:
      label: Discussion
      description: Link to the discussion where the feature was approved.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does the feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: What the feature does, as agreed in the discussion.
    validations:
      required: true
